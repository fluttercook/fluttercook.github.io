<div class="wp-blogger">
<p style="font-size:14px;color:#555">Live Flutter widget preview — Material + Cupertino catalog ported from Flutter Gallery. Browse by group, interact, copy Dart. Full site: <a href="https://fluttercook.github.io/tools/widget-preview/">fluttercook.github.io/tools/widget-preview</a></p>
<div id="wp-app" class="wp-app" data-i18n="en">
  <aside class="wp-side" aria-label="Widget catalog">
    <div class="wp-side-head">
      <div class="wp-brand">Widget <em>Preview</em></div>
      <label class="wp-search">
        <span class="wp-search-icon" aria-hidden="true">⌕</span>
        <input id="wp-search" type="search" placeholder="Search widgets…" autocomplete="off" />
      </label>
    </div>
    <nav id="wp-nav" class="wp-nav"></nav>
  </aside>

  <section class="wp-main">
    <header class="wp-main-head">
      <div>
        <p class="wp-kicker" id="wp-group-label"></p>

        <p class="wp-desc" id="wp-desc"></p>

        <span id="wp-count" class="wp-pill"></span>
      </div>

    <div class="wp-stage-wrap">
      <div class="wp-stage-label">Live preview</div>
      <div id="wp-stage" class="wp-stage" aria-live="polite"></div>
    </div>

    <div class="wp-code-wrap">
      <div class="wp-code-bar">
        <span class="wp-stage-label">Dart</span>
        <div class="wp-code-actions">
          <button type="button" id="wp-copy-link" class="wp-copy ghost" title="Copy shareable link">Copy link</button>
          <button type="button" id="wp-copy" class="wp-copy">Copy code</button>

      </div>
      <pre class="wp-code"><code id="wp-code"></code></pre>
    </div>

    <p class="wp-hint" id="wp-empty" hidden>No widgets match that search.</p>
  </section>
</div>

<style>
.wp-app{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:720px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel2)}

.wp-side-head{padding:16px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.wp-brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:12px;color:var(--ink)}

.wp-credit{font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.35}

.wp-search-icon{color:var(--muted);font-size:14px}
.wp-nav{overflow:auto;padding:10px 8px 18px;flex:1}

.wp-group-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.wp-item{width:100%;text-align:left;background:transparent;border:0;color:var(--muted);border-radius:10px;padding:8px 10px;font:13px/1.3 "SF Mono",ui-monospace,Menlo,monospace;cursor:pointer;display:block}

.wp-item.active{background:rgba(87,227,207,.12);color:var(--accent);font-weight:600}
.wp-main{padding:22px 24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.wp-main-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wp-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.wp-main-head h1{font-size:28px;font-weight:500;margin:0 0 6px;letter-spacing:-.02em}
.wp-desc{color:var(--muted);margin:0;font-size:14px;max-width:52ch;line-height:1.5}
.wp-pill{font-size:11px;border:1px solid var(--line);border-radius:100px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.wp-stage-wrap,.wp-code-wrap{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.wp-stage-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 14px 0}
.wp-stage{min-height:220px;display:flex;align-items:center;justify-content:center;padding:22px;background:
  linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
  var(--bg)}
.wp-code-bar{display:flex;justify-content:space-between;align-items:center;padding-right:10px}
.wp-copy{background:var(--accent);color:#08201c;border:0;border-radius:100px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}

/* Material-ish demo chrome inside stage */
.m3{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1b1f;display:flex;flex-direction:column;gap:14px;width:min(100%,420px)}
.m3-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.m3-elevated,.m3-filled,.m3-outlined,.m3-text{border-radius:20px;padding:10px 24px;font-size:14px;font-weight:500;letter-spacing:.01em;cursor:pointer;border:0;transition:box-shadow .15s,background .15s}
.m3-elevated{background:#e8def8;box-shadow:0 1px 2px rgba(0,0,0,.15);color:#4f378b}
.m3-elevated:hover{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.m3-filled{background:#6750a4;color:#fff}
.m3-outlined{background:transparent;border:1px solid #79747e;color:#6750a4}
.m3-text{background:transparent;color:#6750a4}
.m3-icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:#49454f;cursor:pointer;font-size:18px}
.m3-icon-btn:hover{background:rgba(103,80,164,.08)}
.m3-fab{border:0;border-radius:16px;background:#e8def8;color:#4f378b;width:56px;height:56px;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
.m3-card{background:#fffbfe;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid #e7e0ec}
.m3-card h4{margin:0 0 6px;font-size:16px;font-weight:500}
.m3-card p{margin:0;color:#49454f;font-size:13px;line-height:1.45}
.m3-field{display:flex;flex-direction:column;gap:6px;background:#f7f2fa;border:2px solid #6750a4;border-radius:8px 8px 4px 4px;padding:10px 12px}
.m3-field label{font-size:11px;color:#6750a4;font-weight:600}
.m3-field input{border:0;background:transparent;outline:0;font-size:15px;color:#1c1b1f}
.m3-switch{width:52px;height:32px;border-radius:16px;background:#e7e0ec;position:relative;cursor:pointer;border:2px solid #79747e;transition:background .15s}
.m3-switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#79747e;transition:transform .15s,background .15s}
.m3-switch.on{background:#6750a4;border-color:#6750a4}
.m3-switch.on::after{transform:translateX(20px);background:#fff}
.m3-check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#1c1b1f}
.m3-check .box{width:18px;height:18px;border-radius:2px;border:2px solid #79747e;display:grid;place-items:center;color:#fff;font-size:12px}
.m3-check.on .box{background:#6750a4;border-color:#6750a4}
.m3-radio{width:20px;height:20px;border-radius:50%;border:2px solid #79747e;display:grid;place-items:center}
.m3-radio.on{border-color:#6750a4}
.m3-radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:#6750a4}
.m3-slider{width:100%;accent-color:#6750a4}
.m3-chip{border-radius:8px;padding:6px 12px;font-size:13px;border:1px solid #79747e;color:#49454f;background:transparent;cursor:pointer}
.m3-chip.on{background:#e8def8;border-color:#e8def8;color:#4f378b}
.m3-list{background:#fffbfe;border-radius:12px;border:1px solid #e7e0ec;overflow:hidden}
.m3-list-item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #e7e0ec;font-size:14px}
.m3-list-item:last-child{border-bottom:0}
.m3-avatar{width:40px;height:40px;border-radius:50%;background:#e8def8;color:#4f378b;display:grid;place-items:center;font-weight:600;font-size:13px}
.m3-appbar{background:#e8def8;color:#1c1b1f;border-radius:0;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:500}
.m3-nav{display:flex;justify-content:space-around;background:#e8def8;border-radius:28px;padding:8px}
.m3-nav button{border:0;background:transparent;color:#49454f;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 10px;border-radius:16px}
.m3-nav button.active{background:#d0bcff;color:#1c1b1f;font-weight:600}
.m3-nav .ico{font-size:18px}
.m3-tabs{display:flex;gap:0;border-bottom:1px solid #e7e0ec}
.m3-tabs button{flex:1;border:0;background:transparent;padding:12px;font-size:13px;font-weight:600;color:#49454f;cursor:pointer;border-bottom:3px solid transparent}
.m3-tabs button.active{color:#6750a4;border-bottom-color:#6750a4}
.m3-progress{height:4px;background:#e7e0ec;border-radius:2px;overflow:hidden}
.m3-progress i{display:block;height:100%;background:#6750a4;width:40%}
.m3-spinner{width:40px;height:40px;border-radius:50%;border:4px solid #e7e0ec;border-top-color:#6750a4;animation:wp-spin 1s linear infinite}
@keyframes wp-spin{to{transform:rotate(360deg)}}
.m3-snack{background:#322f35;color:#f5eff7;border-radius:8px;padding:14px 16px;font-size:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.m3-snack a{color:#d0bcff;font-weight:700;cursor:pointer}
.m3-badge{background:#b3261e;color:#fff;border-radius:10px;font-size:10px;padding:2px 6px;font-weight:700}
.m3-dialog{background:#fffbfe;border-radius:28px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:280px;text-align:center}
.m3-dialog h4{margin:0 0 10px;font-size:20px;font-weight:400}
.m3-dialog p{margin:0 0 18px;color:#49454f;font-size:14px;line-height:1.45}
.m3-dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.m3-expansion{background:#fffbfe;border:1px solid #e7e0ec;border-radius:12px;overflow:hidden}
.m3-expansion summary{padding:14px 16px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.m3-expansion summary::-webkit-details-marker{display:none}
.m3-expansion .body{padding:0 16px 14px;color:#49454f;font-size:13px;line-height:1.45}
.m3-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-width:860px){.wp-app{grid-template-columns:1fr}.wp-side{max-height:280px;border-right:0;border-bottom:1px solid var(--line)}}
</style>

<script>
// Extra widgets ported from the official Flutter Gallery demo catalog
// (github.com/flutter/gallery / azchohfi/flutter_gallery). Appended to WIDGETS.

const GALLERY_EXTRA = [
  { id:'toggle-buttons', group:'Buttons', title:'Toggle', label:'ToggleButtons',
    desc:'Multi-select segmented control.',
    code:`ToggleButtons(\n  isSelected: const [true, false, false],\n  onPressed: (i) {},\n  children: const [Icon(Icons.format_bold), Icon(Icons.format_italic), Icon(Icons.format_underline)],\n)`,
    render(){
      const wrap = el('div','m3');
      const r = el('div','m3-toggle');
      ['B','I','U'].forEach((t,i)=>{
        const b = btn('m3-toggle-btn'+(i===0?' on':''), t, ()=>{
          r.querySelectorAll('.m3-toggle-btn').forEach(x=>x.classList.remove('on'));
          b.classList.add('on');
        });
        r.appendChild(b);
      });
      wrap.appendChild(r); return wrap;
    } },
  { id:'action-chip', group:'Surfaces', title:'ActionChip', label:'ActionChip',
    desc:'Chip that triggers an action.',
    code:`ActionChip(\n  avatar: const Icon(Icons.alarm),\n  label: const Text('Set alarm'),\n  onPressed: () {},\n)`,
    render(){
      const wrap = el('div','m3');
      const r = el('div','m3-wrap');
      const c = btn('m3-chip on','⏱ Set alarm',()=>{});
      r.appendChild(c); wrap.appendChild(r); return wrap;
    } },
  { id:'choice-chip', group:'Surfaces', title:'ChoiceChip', label:'ChoiceChip',
    desc:'Single-select chip.',
    code:`ChoiceChip(\n  label: const Text('Small'),\n  selected: true,\n  onSelected: (v) {},\n)`,
    render(){
      const wrap = el('div','m3');
      const r = el('div','m3-wrap');
      ['Small','Medium','Large'].forEach((t,i)=>{
        const c = btn('m3-chip'+(i===1?' on':''), t, ()=>{
          r.querySelectorAll('.m3-chip').forEach(x=>x.classList.remove('on'));
          c.classList.add('on');
        });
        r.appendChild(c);
      });
      wrap.appendChild(r); return wrap;
    } },
  { id:'data-table', group:'Layout', title:'DataTable', label:'DataTable',
    desc:'Tabular data with selectable rows.',
    code:`DataTable(\n  columns: const [\n    DataColumn(label: Text('Dessert')),\n    DataColumn(label: Text('Calories'), numeric: true),\n  ],\n  rows: const [\n    DataRow(cells: [DataCell(Text('Frozen yogurt')), DataCell(Text('159'))]),\n    DataRow(cells: [DataCell(Text('Ice cream')), DataCell(Text('237'))]),\n  ],\n)`,
    render(){
      const wrap = el('div','m3');
      const t = el('div','m3-table');
      t.innerHTML = '<div class="m3-tr head"><span>Dessert</span><span>Calories</span></div>'+
        '<div class="m3-tr"><span>Frozen yogurt</span><span>159</span></div>'+
        '<div class="m3-tr"><span>Ice cream</span><span>237</span></div>'+
        '<div class="m3-tr"><span>Eclair</span><span>262</span></div>';
      wrap.appendChild(t); return wrap;
    } },
  { id:'divider', group:'Layout', title:'Divider', label:'Divider',
    desc:'Horizontal and vertical separators.',
    code:`const Divider()\nconst VerticalDivider()`,
    render(){
      const wrap = el('div','m3');
      const a = labelSpan('Item above');
      const d = el('div','m3-hr');
      const b = labelSpan('Item below');
      const r = row();
      const l = labelSpan('Left'); l.style.padding='0 12px';
      const v = el('div','m3-vr');
      const rr = labelSpan('Right'); rr.style.padding='0 12px';
      r.append(l,v,rr);
      wrap.append(a,d,b,r); return wrap;
    } },
  { id:'grid-list', group:'Layout', title:'GridView', label:'GridView.count',
    desc:'Two-dimensional scrolling grid.',
    code:`GridView.count(\n  crossAxisCount: 3,\n  children: List.generate(6, (i) => Card(child: Center(child: Text('$i')))),\n)`,
    render(){
      const wrap = el('div','m3');
      const g = el('div','m3-grid');
      for(let i=1;i<=6;i++){
        const c = el('div','m3-tile'); c.textContent = String(i);
        g.appendChild(c);
      }
      wrap.appendChild(g); return wrap;
    } },
  { id:'bottom-sheet', group:'Surfaces', title:'BottomSheet', label:'showModalBottomSheet',
    desc:'Sheet rising from the bottom edge.',
    code:`showModalBottomSheet<void>(\n  context: context,\n  builder: (context) => SizedBox(\n    height: 200,\n    child: Center(child: Text('Sheet content')),\n  ),\n)`,
    render(){
      const wrap = el('div','m3');
      const s = el('div','m3-sheet');
      const handle = el('div','m3-sheet-handle');
      const body = el('div','m3-sheet-body');
      body.innerHTML = '<strong>Share</strong><div style="margin-top:10px;display:flex;gap:16px;justify-content:center;font-size:20px">✉ ⌘ ☁</div>';
      s.append(handle, body);
      wrap.appendChild(s); return wrap;
    } },
  { id:'banner', group:'Feedback', title:'MaterialBanner', label:'MaterialBanner',
    desc:'In-flow important message.',
    code:`MaterialBanner(\n  content: const Text('Connection lost. Changes will sync later.'),\n  actions: [\n    TextButton(onPressed: () {}, child: const Text('Retry')),\n    TextButton(onPressed: () {}, child: const Text('Dismiss')),\n  ],\n)`,
    render(){
      const wrap = el('div','m3');
      const b = el('div','m3-banner');
      b.innerHTML = '<div>Connection lost. Changes will sync later.</div>'+
        '<div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">'+
        '<button class="m3-text" type="button">Retry</button>'+
        '<button class="m3-text" type="button">Dismiss</button></div>';
      wrap.appendChild(b); return wrap;
    } },
  { id:'tooltip', group:'Feedback', title:'Tooltip', label:'Tooltip',
    desc:'Informative label on long-press/hover.',
    code:`Tooltip(\n  message: 'More options',\n  child: IconButton(icon: const Icon(Icons.more_vert), onPressed: () {}),\n)`,
    render(){
      const wrap = el('div','m3');
      const box = el('div','m3-tip-wrap');
      const tip = el('div','m3-tip'); tip.textContent='More options';
      const ic = btn('m3-icon-btn','⋮',()=>{ tip.classList.toggle('show'); });
      box.append(ic, tip);
      wrap.appendChild(box);
      setTimeout(()=>tip.classList.add('show'), 400);
      return wrap;
    } },
  { id:'menu', group:'Surfaces', title:'PopupMenu', label:'PopupMenuButton',
    desc:'Overflow menu anchored to a button.',
    code:`PopupMenuButton<String>(\n  onSelected: (v) {},\n  itemBuilder: (context) => const [\n    PopupMenuItem(value: 'share', child: Text('Share')),\n    PopupMenuItem(value: 'copy', child: Text('Copy link')),\n  ],\n)`,
    render(){
      const wrap = el('div','m3');
      const box = el('div','m3-tip-wrap');
      const menu = el('div','m3-popup');
      menu.innerHTML = '<div>Share</div><div>Copy link</div><div>Settings</div>';
      const ic = btn('m3-icon-btn','⋮',()=>{ menu.classList.toggle('show'); });
      box.append(ic, menu);
      wrap.appendChild(box);
      setTimeout(()=>menu.classList.add('show'), 300);
      return wrap;
    } },
  { id:'nav-drawer', group:'Navigation', title:'Drawer', label:'NavigationDrawer',
    desc:'Side navigation panel.',
    code:`Drawer(\n  child: ListView(children: const [\n    DrawerHeader(child: Text('FlutterCook')),\n    ListTile(leading: Icon(Icons.inbox), title: Text('Inbox')),\n    ListTile(leading: Icon(Icons.star), title: Text('Starred')),\n  ]),\n)`,
    render(){
      const wrap = el('div','m3');
      const d = el('div','m3-drawer');
      d.innerHTML = '<div class="m3-drawer-head">FlutterCook</div>'+
        '<div class="m3-list-item active">📥 Inbox</div>'+
        '<div class="m3-list-item">⭐ Starred</div>'+
        '<div class="m3-list-item">⚙ Settings</div>';
      wrap.appendChild(d); return wrap;
    } },
  { id:'nav-rail', group:'Navigation', title:'NavigationRail', label:'NavigationRail',
    desc:'Compact side rail for adaptive layouts.',
    code:`NavigationRail(\n  selectedIndex: 0,\n  destinations: const [\n    NavigationRailDestination(icon: Icon(Icons.inbox), label: Text('Inbox')),\n    NavigationRailDestination(icon: Icon(Icons.star), label: Text('Star')),\n  ],\n)`,
    render(){
      const wrap = el('div','m3');
      const r = el('div','m3-rail');
      [['⌂','Inbox'],['☆','Star'],['☺','Me']].forEach(([ico,lab],i)=>{
        const b = document.createElement('button'); b.type='button'; b.className=i===0?'active':'';
        b.innerHTML = '<span class="ico">'+ico+'</span><span>'+lab+'</span>';
        b.onclick=()=>{ r.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
        r.appendChild(b);
      });
      wrap.appendChild(r); return wrap;
    } },
  { id:'bottom-app-bar', group:'Navigation', title:'BottomAppBar', label:'BottomAppBar',
    desc:'Surface docked at the bottom with actions + FAB.',
    code:`Scaffold(\n  bottomNavigationBar: BottomAppBar(\n    child: Row(children: [\n      IconButton(icon: const Icon(Icons.menu), onPressed: () {}),\n      const Spacer(),\n      IconButton(icon: const Icon(Icons.search), onPressed: () {}),\n    ]),\n  ),\n  floatingActionButton: FloatingActionButton(onPressed: () {}, child: Icon(Icons.add)),\n)`,
    render(){
      const wrap = el('div','m3');
      const bar = el('div','m3-bab');
      bar.innerHTML = '<button class="m3-icon-btn" type="button">☰</button>'+
        '<button class="m3-fab" type="button" style="width:44px;height:44px;font-size:18px">+</button>'+
        '<button class="m3-icon-btn" type="button">⌕</button>';
      wrap.appendChild(bar); return wrap;
    } },
  { id:'range-slider', group:'Inputs', title:'RangeSlider', label:'RangeSlider',
    desc:'Select a numeric range.',
    code:`RangeSlider(\n  values: const RangeValues(20, 70),\n  onChanged: (v) {},\n)`,
    render(){
      const wrap = el('div','m3');
      const box = el('div'); box.style.cssText='position:relative;width:100%;height:28px';
      const track = el('div'); track.style.cssText='position:absolute;top:12px;left:0;right:0;height:4px;background:#e7e0ec;border-radius:2px';
      const fill = el('div'); fill.style.cssText='position:absolute;top:12px;left:20%;width:50%;height:4px;background:#6750a4;border-radius:2px';
      [20,70].forEach(p=>{
        const h = el('div'); h.style.cssText='position:absolute;top:4px;left:'+p+'%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#6750a4';
        box.appendChild(h);
      });
      box.append(track, fill);
      wrap.appendChild(box); return wrap;
    } },

    { id:'list', group:'Layout', title:'ListTile', label:'ListTile',
      desc:'Row with leading, title, trailing.',
      code:`ListTile(\n  leading: CircleAvatar(child: Text('A')),\n  title: const Text('Alice'),\n  subtitle: const Text('Design review · 2m'),\n  trailing: const Icon(Icons.chevron_right),\n  onTap: () {},\n)`,
      render(){
        const wrap = el('div','m3');
        const list = el('div','m3-list');
        [['A','Alice','Design review · 2m'],['B','Bao','Pushed fix · 11m']].forEach(([av,t,s])=>{
          const item = el('div','m3-list-item');
          const a = el('div','m3-avatar'); a.textContent=av;
          const txt = el('div');
          const tt = el('div'); tt.textContent=t; tt.style.fontWeight='600';
          const ss = el('div'); ss.textContent=s; ss.style.color='#49454f'; ss.style.fontSize='12px';
          txt.append(tt,ss); item.append(a,txt);
          list.appendChild(item);
        });
        wrap.appendChild(list); return wrap;
      } },
    { id:'expansion', group:'Layout', title:'ExpansionTile', label:'ExpansionTile',
      desc:'Collapsible section.',
      code:`ExpansionTile(\n  title: const Text('Account'),\n  children: const [\n    ListTile(title: Text('Email')),\n    ListTile(title: Text('Password')),\n  ],\n)`,
      render(){
        const wrap = el('div','m3');
        const d = document.createElement('details'); d.className='m3-expansion'; d.open=true;
        const s = document.createElement('summary');
        s.append(labelSpan('Account'), labelSpan('▾'));
        const b = el('div','body'); b.textContent='Email · Password · Devices';
        d.append(s,b); wrap.appendChild(d); return wrap;
      } },
    { id:'progress', group:'Feedback', title:'Progress', label:'Linear + Circular',
      desc:'Indeterminate and determinate progress.',
      code:`const LinearProgressIndicator(value: 0.4)\nconst CircularProgressIndicator()`,
      render(){
        const wrap = el('div','m3');
        const bar = el('div','m3-progress'); const i = el('i'); bar.appendChild(i);
        const r = row(); const sp = el('div','m3-spinner');
        r.appendChild(sp);
        wrap.append(bar, r);
        return wrap;
      } },
    { id:'snackbar', group:'Feedback', title:'SnackBar', label:'SnackBar',
      desc:'Transient confirmation with optional action.',
      code:`ScaffoldMessenger.of(context).showSnackBar(\n  SnackBar(\n    content: const Text('Message sent'),\n    action: SnackBarAction(label: 'Undo', onPressed: () {}),\n  ),\n)`,
      render(){
        const wrap = el('div','m3');
        const s = el('div','m3-snack');
        const t = document.createElement('span'); t.textContent='Message sent';
        const a = document.createElement('a'); a.textContent='Undo'; a.onclick=()=>{};
        s.append(t,a); wrap.appendChild(s); return wrap;
      } },
    { id:'badge', group:'Feedback', title:'Badge', label:'Badge',
      desc:'Count or status marker on an icon.',
      code:`Badge(\n  label: const Text('3'),\n  child: const Icon(Icons.mail),\n)`,
      render(){
        const wrap = el('div','m3');
        const r = row();
        const holder = el('div'); holder.style.position='relative'; holder.style.display='inline-flex';
        const ic = btn('m3-icon-btn','✉',()=>{});
        const b = el('div','m3-badge'); b.textContent='3';
        b.style.position='absolute'; b.style.top='2px'; b.style.right='2px';
        holder.append(ic,b); r.appendChild(holder); wrap.appendChild(r);
        return wrap;
      } },
  ];
  const WIDGETS = WIDGETS_BASE.concat(typeof GALLERY_EXTRA !== 'undefined' ? GALLERY_EXTRA : []);

  function el(tag, cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }
  function row(){ return el('div','m3-row'); }
  function btn(cls, text, onClick){ const b=document.createElement('button'); b.type='button'; b.className=cls; b.textContent=text; b.onclick=onClick; return b; }
  function labelSpan(t){ const s=document.createElement('span'); s.textContent=t; return s; }

  const groups = [...new Set(WIDGETS.map(w=>w.group))];
  const nav = document.getElementById('wp-nav');
  const stage = document.getElementById('wp-stage');
  const codeEl = document.getElementById('wp-code');
  const titleEl = document.getElementById('wp-title');
  const descEl = document.getElementById('wp-desc');
  const groupEl = document.getElementById('wp-group-label');
  const countEl = document.getElementById('wp-count');
  const emptyEl = document.getElementById('wp-empty');
  const searchEl = document.getElementById('wp-search');
  const copyBtn = document.getElementById('wp-copy');
  const copyLinkBtn = document.getElementById('wp-copy-link');
  let activeId = WIDGETS[0].id;
  let filter = '';

  function matches(w){
    const q = filter.trim().toLowerCase();
    if(!q) return true;
    return (w.label+' '+w.title+' '+w.group+' '+w.desc+' '+w.code).toLowerCase().includes(q);
  }

  function renderNav(){
    nav.innerHTML='';
    let shown=0;
    groups.forEach(g=>{
      const items = WIDGETS.filter(w=>w.group===g && matches(w));
      if(!items.length) return;
      const box = el('div','wp-group');
      const t = el('div','wp-group-title'); t.textContent=g;
      box.appendChild(t);
      items.forEach(w=>{
        shown++;
        const b = el('button','wp-item'+(w.id===activeId?' active':''));
        b.type='button'; b.dataset.id=w.id; b.textContent=w.label;
        b.onclick=()=>select(w.id);
        box.appendChild(b);
      });
      nav.appendChild(box);
    });
    countEl.textContent = shown + ' widgets';
    emptyEl.hidden = shown>0;
    return shown;
  }

  function idFromUrl(){
    try{
      const u = new URL(window.location.href);
      const w = (u.searchParams.get('w') || '').trim().toLowerCase();
      if(w && WIDGETS.some(x=>x.id===w)) return w;
      const hash = (u.hash || '').replace(/^#/, '').trim().toLowerCase();
      if(hash && WIDGETS.some(x=>x.id===hash)) return hash;
    }catch(e){}
    return null;
  }

  function syncUrl(id){
    try{
      const url = new URL(window.location.href);
      url.searchParams.set('w', id);
      url.hash = '';
      history.replaceState(null, '', url.toString());
    }catch(e){}
  }

  function shareUrl(id){
    try{
      const url = new URL(window.location.href);
      url.searchParams.set('w', id);
      url.hash = '';
      return url.toString();
    }catch(e){
      return window.location.href;
    }
  }

  function select(id, opts){
    const push = !opts || opts.push !== false;
    activeId=id;
    const w = WIDGETS.find(x=>x.id===id) || WIDGETS[0];
    activeId=w.id;
    titleEl.textContent = w.label;
    descEl.textContent = w.desc;
    groupEl.textContent = w.group;
    stage.innerHTML='';
    stage.appendChild(w.render());
    codeEl.textContent = w.code;
    nav.querySelectorAll('.wp-item').forEach(b=>b.classList.toggle('active', b.dataset.id===w.id));
    if(push) syncUrl(w.id);
  }

  searchEl.addEventListener('input', ()=>{
    filter = searchEl.value;
    const shown = renderNav();
    if(shown){
      const still = WIDGETS.some(w=>w.id===activeId && matches(w));
      if(!still){
        const first = WIDGETS.find(matches);
        if(first) select(first.id);
      }
    }
  });

  copyBtn.addEventListener('click', async ()=>{
    const text = codeEl.textContent || '';
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const prev = copyBtn.textContent;
    copyBtn.textContent='Copied';
    setTimeout(()=>{ copyBtn.textContent=prev; }, 1200);
  });

  copyLinkBtn.addEventListener('click', async ()=>{
    const link = shareUrl(activeId);
    try{
      await navigator.clipboard.writeText(link);
    }catch(e){
      const ta=document.createElement('textarea'); ta.value=link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const prev = copyLinkBtn.textContent;
    copyLinkBtn.textContent='Copied';
    setTimeout(()=>{ copyLinkBtn.textContent=prev; }, 1200);
  });

  // VI labels if present
  if(document.getElementById('wp-app')?.dataset.i18n==='vi'){
    searchEl.placeholder='Tìm widget…';
    copyBtn.textContent='Sao chép code';
    copyLinkBtn.textContent='Sao chép link';
    document.querySelector('.wp-stage-wrap .wp-stage-label').textContent='Xem trước trực tiếp';
  }

  renderNav();
  select(idFromUrl() || activeId, { push: !!idFromUrl() });
  // Always normalize URL on first paint so a bare page is still shareable after first click.
  if(!idFromUrl()) syncUrl(activeId);
})();
</script>

</div>
